services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: challenge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  postgres_data: